<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://raw.githubusercontent.com; img-src blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>本轮改动预览</title>
  <style>
    :root{color-scheme:light;--paper:#f4f1e9;--ink:#343a31;--muted:#73786d;--line:#d7d5ca}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;padding:48px clamp(16px,4vw,64px) 72px}
    main{max-width:1600px;margin:auto}
    header{padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
    .eyebrow{font:11px/1.6 Georgia,serif;letter-spacing:.22em;color:var(--muted);margin:0 0 18px}
    h1{font:400 clamp(24px,3vw,38px)/1.4 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.08em;margin:0 0 12px}
    .note{font-size:13px;line-height:1.8;color:var(--muted);margin:0}
    #status{font-size:14px;line-height:1.9;margin:28px 0 18px;overflow-wrap:anywhere}
    progress{appearance:none;width:100%;height:3px;border:0;background:var(--line);display:block;margin:0 0 28px;accent-color:var(--ink)}
    progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:var(--ink)}progress::-moz-progress-bar{background:var(--ink)}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
    button,.download{font:inherit;font-size:12px;line-height:1.5;border:1px solid var(--line);border-radius:2px;padding:7px 14px;background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
    button:hover,.download:hover{background:#e8e7dd}
    button:focus-visible,a:focus-visible{outline:2px solid #7d8566;outline-offset:4px}
    figure{margin:0 0 48px;scroll-margin-top:24px}
    figcaption{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 12px}
    .label{font-size:15px;line-height:1.7;letter-spacing:.02em}
    .download{white-space:nowrap;flex-shrink:0;font-size:12px}
    .image-link{display:block;line-height:0;text-decoration:none;background:#e9e7de}
    img{display:block;width:100%;height:auto;max-width:1600px;margin:auto}
    footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px;line-height:1.9}
    [hidden]{display:none!important}
    @media(max-width:520px){body{padding-top:30px}figure{margin-bottom:30px}.label{font-size:13px}.download{padding:6px 10px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">SELECTED WORKS · REVIEW</p>
      <h1>本轮改动预览</h1>
      <p class="note">仅预览，尚未合并 PDF。点击图片可单独放大查看。</p>
      <nav id="navigation" aria-label="跳转至预览图片" hidden></nav>
    </header>
    <p id="status" role="status" aria-live="polite">正在准备图片…</p>
    <progress id="progress" aria-label="图片准备进度"></progress>
    <div id="gallery"></div>
    <footer>请保留完整链接；链接末尾的内容用于在浏览器中读取本轮预览。</footer>
    <noscript><p>请启用 JavaScript，并使用完整链接在 Safari 或 Chrome 中打开。</p></noscript>
  </main>
  <script>
    'use strict';
    const ASSET_BASE='https://raw.githubusercontent.com/zhefeihuang/zhefeihuang.github.io/main/review/7e77732ce7b2124efb102a48a2cdf235/';
    const statusElement=document.getElementById('status');
    const progressElement=document.getElementById('progress');
    const objectURLs=[];
    function fail(message){statusElement.hidden=false;statusElement.textContent=message;progressElement.hidden=true;}
    function base64Bytes(text){
      const binary=atob(text),bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return bytes;
    }
    function decodeKey(text){
      if(!/^[A-Za-z0-9_-]{43}$/.test(text))throw new Error('missing-key');
      const bytes=base64Bytes(text.replace(/-/g,'+').replace(/_/g,'/')+'=');
      if(bytes.length!==32)throw new Error('missing-key');
      return bytes;
    }
    async function readBytes(response){
      if(!response.body || !response.body.getReader)return new Uint8Array(await response.arrayBuffer());
      const length=Number(response.headers.get('content-length'))||0;
      if(length){progressElement.max=length;progressElement.value=0;}
      const chunks=[],reader=response.body.getReader();let received=0;
      while(true){
        const part=await reader.read();if(part.done)break;
        chunks.push(part.value);received+=part.value.length;
        if(length)progressElement.value=received;
        statusElement.textContent='正在准备图片… '+(received/1000000).toFixed(1)+' MB';
      }
      const bytes=new Uint8Array(received);let offset=0;
      for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length;}
      return bytes;
    }
    async function prepare(){
      try{
        const keyBytes=decodeKey(location.hash.slice(1));
        if(!globalThis.crypto || !crypto.subtle)throw new Error('insecure-browser');
        const url=new URL('preview.enc',ASSET_BASE);url.searchParams.set('t',String(Date.now()));
        const response=await fetch(url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
        if(!response.ok)throw new Error('fetch-failed');
        const encrypted=await readBytes(response);
        if(encrypted.length<29)throw new Error('invalid-file');
        statusElement.textContent='正在核对图片…';progressElement.removeAttribute('value');
        const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);
        keyBytes.fill(0);
        const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:encrypted.slice(0,12),tagLength:128},key,encrypted.slice(12));
        const bundle=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(clear));
        if(bundle.version!==1 || !Array.isArray(bundle.items) || (bundle.items.length<1 || bundle.items.length>40))throw new Error('invalid-file');
        const gallery=document.getElementById('gallery');
        const navigation=document.getElementById('navigation');
        const fragment=document.createDocumentFragment();
        for(let index=0;index<bundle.items.length;index++){
          const item=bundle.items[index];
          if(item.mime!=='image/jpeg' || typeof item.data!=='string' || typeof item.title!=='string' ||
             !Number.isInteger(item.width)||!Number.isInteger(item.height)||item.width<1||item.width>16000||item.height<1||item.height>16000)throw new Error('invalid-file');
          const bytes=base64Bytes(item.data);
          if(bytes[0]!==255||bytes[1]!==216)throw new Error('invalid-file');
          const number=String(index+1).padStart(2,'0');
          const objectURL=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));objectURLs.push(objectURL);
          const figure=document.createElement('figure');figure.id='page-'+number;
          const caption=document.createElement('figcaption');
          const label=document.createElement('span');label.className='label';label.textContent=number+' · '+item.title;
          const download=document.createElement('a');download.className='download';download.href=objectURL;
          download.download='portfolio-review-'+number+'.jpg';download.textContent='保存图片';
          caption.append(label,download);
          const imageLink=document.createElement('a');imageLink.className='image-link';imageLink.href=objectURL;
          imageLink.target='_blank';imageLink.rel='noopener noreferrer';imageLink.setAttribute('aria-label','单独查看 '+item.title);
          const image=document.createElement('img');image.src=objectURL;image.alt=item.title;
          image.width=item.width;image.height=item.height;image.loading=index?'lazy':'eager';image.decoding='async';
          imageLink.append(image);figure.append(caption,imageLink);fragment.append(figure);
          const button=document.createElement('button');button.type='button';button.textContent=number;
          button.setAttribute('aria-label','跳转到 '+item.title);
          button.addEventListener('click',()=>figure.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'}));
          navigation.append(button);
        }
        gallery.append(fragment);navigation.hidden=false;progressElement.hidden=true;
        statusElement.textContent=bundle.items.length+' 张改动页已就绪。';
      }catch(error){
        if(error && error.message==='missing-key')fail('请使用收到的完整私密链接打开，链接末尾的内容也需要保留。');
        else if(error && error.message==='insecure-browser')fail('请使用最新版 Safari 或 Chrome，通过完整的 HTTPS 链接打开。');
        else if(error && error.name==='OperationError')fail('链接不完整，或图片未能解密。请重新打开收到的完整链接。');
        else fail('图片暂未加载成功。请检查网络，然后刷新页面重试。');
      }
    }
    prepare();
    addEventListener('pagehide',event=>{if(!event.persisted)for(const url of objectURLs)URL.revokeObjectURL(url);});
  </script>
</body>
</html>
