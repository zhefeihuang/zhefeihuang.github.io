<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>黄浙菲 · 作品集</title>
  <style>
    :root{color-scheme:light;--paper:#f4f1e9;--ink:#333a31;--muted:#777a70;--line:#d4d2c7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC",serif;display:grid;place-items:center;padding:36px 22px}
    main{width:min(100%,600px);padding:42px 0 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .eyebrow{font:11px/1.6 Georgia,serif;letter-spacing:.22em;color:var(--muted);margin:0 0 40px}
    h1{font:italic 48px/1.08 Georgia,"Times New Roman",serif;font-weight:400;margin:0 0 20px;letter-spacing:-.025em}
    .author{font-size:15px;letter-spacing:.15em;margin:0 0 32px}
    #details{font:13px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);margin:0 0 28px}
    #status{font:14px/1.9 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:54px;margin:0 0 18px;overflow-wrap:anywhere}
    progress{appearance:none;width:100%;height:2px;border:0;background:#deddd4;display:block;margin:20px 0 30px;accent-color:var(--ink)}
    progress::-webkit-progress-bar{background:#deddd4}progress::-webkit-progress-value{background:var(--ink)}progress::-moz-progress-bar{background:var(--ink)}
    #actions{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-top:10px}
    .save{display:inline-block;padding:14px 28px;background:var(--ink);border:1px solid var(--ink);border-radius:2px;color:var(--paper);text-decoration:none;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.1em}
    .save:hover{background:#485142}.save:focus-visible,.preview:focus-visible{outline:2px solid #7a815d;outline-offset:5px}
    .preview{color:var(--muted);text-underline-offset:5px;font:13px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    footer{margin-top:42px;color:var(--muted);font:11px/1.9 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.02em}
    [hidden]{display:none!important}
    @media(max-width:420px){h1{font-size:40px}main{padding-top:30px}.eyebrow{margin-bottom:32px}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">SELECTED WORKS · PRIVATE DELIVERY</p>
    <h1>Selected Works</h1>
    <p class="author">黄浙菲 · Zhefei Huang</p>
    <p id="details">作品集 PDF</p>
    <p id="status" role="status" aria-live="polite">正在准备文件…</p>
    <progress id="progress" aria-label="文件准备进度"></progress>
    <div id="actions" hidden>
      <a id="save" class="save">保存 PDF</a>
      <a id="preview" class="preview" target="_blank" rel="noopener noreferrer">在浏览器中查看 ↗</a>
    </div>
    <footer>请保留完整链接。文件准备完成后，可直接保存到电脑。</footer>
    <noscript><p>请在浏览器中启用 JavaScript，然后重新打开完整链接。</p></noscript>
  </main>
  <script>
    'use strict';
    const ASSET_BASE='https://raw.githubusercontent.com/zhefeihuang/zhefeihuang.github.io/main/receive/af3b263cab1343da2a78e5d886659b65/';
    const statusElement=document.getElementById('status');
    const progressElement=document.getElementById('progress');
    let objectURL;
    function fail(message){statusElement.textContent=message;progressElement.hidden=true;document.getElementById('actions').hidden=true;}
    function decodeKey(value){
      if(!/^[A-Za-z0-9_-]{43}$/.test(value))throw new Error('missing-key');
      const bytes=Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));
      if(bytes.length!==32)throw new Error('missing-key');
      return bytes;
    }
    async function readEncrypted(response){
      if(!response.body || !response.body.getReader)return new Uint8Array(await response.arrayBuffer());
      const total=Number(response.headers.get('content-length'))||0;
      if(total){progressElement.max=total;progressElement.value=0;}
      const reader=response.body.getReader(),chunks=[];
      let received=0;
      while(true){
        const item=await reader.read();
        if(item.done)break;
        chunks.push(item.value);received+=item.value.length;
        if(total)progressElement.value=received;
        statusElement.textContent='正在准备文件… '+(received/1000000).toFixed(1)+' MB';
      }
      const bytes=new Uint8Array(received);let offset=0;
      for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length;}
      return bytes;
    }
    async function prepare(){
      try{
        const keyBytes=decodeKey(location.hash.slice(1));
        if(!globalThis.crypto || !crypto.subtle)throw new Error('insecure-browser');
        const manifestURL=new URL('manifest.json',ASSET_BASE);manifestURL.searchParams.set('t',String(Date.now()));
        const manifestResponse=await fetch(manifestURL,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
        if(!manifestResponse.ok)throw new Error('fetch-failed');
        const manifest=await manifestResponse.json();
        if(!Number.isSafeInteger(manifest.bytes)||manifest.bytes<=0||!Number.isSafeInteger(manifest.pages)||!/^[a-fA-F0-9]{64}$/.test(manifest.sha256)||typeof manifest.filename!=='string')throw new Error('manifest-invalid');
        document.getElementById('details').textContent=manifest.pages+' 页 · '+(manifest.bytes/1000000).toFixed(1)+' MB · PDF';
        const encryptedURL=new URL('portfolio.enc',ASSET_BASE);encryptedURL.searchParams.set('v',manifest.sha256);
        const response=await fetch(encryptedURL,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
        if(!response.ok)throw new Error('fetch-failed');
        const encrypted=await readEncrypted(response);
        if(encrypted.length<29)throw new Error('file-invalid');
        statusElement.textContent='正在核对文件…';progressElement.removeAttribute('value');
        const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);
        keyBytes.fill(0);
        const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:encrypted.slice(0,12),tagLength:128},key,encrypted.slice(12));
        if(decrypted.byteLength!==manifest.bytes)throw new Error('file-invalid');
        const digest=await crypto.subtle.digest('SHA-256',decrypted);
        const actual=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
        if(actual!==manifest.sha256.toLowerCase())throw new Error('file-invalid');
        const signature=new Uint8Array(decrypted,0,5);
        if(String.fromCharCode(...signature)!=='%PDF-')throw new Error('file-invalid');
        objectURL=URL.createObjectURL(new Blob([decrypted],{type:'application/pdf'}));
        const save=document.getElementById('save');
        save.href=objectURL;save.download=manifest.filename.replace(/[\\/\x00-\x1f]/g,'_');
        document.getElementById('preview').href=objectURL;
        document.getElementById('actions').hidden=false;
        statusElement.textContent='文件已就绪，点击下方按钮保存。';
        progressElement.hidden=true;
      }catch(error){
        const code=error && error.message;
        if(code==='missing-key')fail('请使用收到的完整私密链接打开此页，链接末尾的内容也需要保留。');
        else if(code==='insecure-browser')fail('请用最新版 Safari 或 Chrome，通过完整的 HTTPS 链接打开此页。');
        else if(error && error.name==='OperationError')fail('链接不完整或文件未能解密。请重新打开收到的完整链接。');
        else fail('文件暂未准备成功。请检查网络，然后刷新此页重试。');
      }
    }
    prepare();
    addEventListener('pagehide',event=>{if(!event.persisted&&objectURL)URL.revokeObjectURL(objectURL);});
  </script>
</body>
</html>
